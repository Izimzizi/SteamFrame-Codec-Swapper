name: Tests

# Runs the suites that need no GPU, no SteamVR and no Frame on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: .NET tests
        shell: pwsh
        run: |
          foreach ($project in 'CodecSwapperTests', 'CoreTests', 'PatcherTests', 'StreamingHealthTests') {
            dotnet test "Tests/$project" --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Frame supervisor tests
        working-directory: Frame/Codec
        run: python -m unittest
      - name: Compositor timing check
        run: dotnet run --project Tests/CompositorTimingTests
      - name: Native hook build and tests that need no GPU
        shell: pwsh
        run: |
          ./Native/H264Hook/build.ps1
          foreach ($test in 'picture_abi_test', 'hevc_options_test') {
            & "artifacts/H264Hook/$test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native encoder probe tests
        shell: pwsh
        run: |
          cmake -S Native -B Native/build-ci
          cmake --build Native/build-ci --config Release
          ctest --test-dir Native/build-ci -C Release --output-on-failure
